name: DevOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # Stage 1: Build & Automated Testing (Continuous Integration)
  build-and-test:
    name: Build & Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Run Tests
        run: mvn clean test --batch-mode

      - name: Package JAR Artifact
        run: mvn package -DskipTests=true --batch-mode

      - name: Archive Production JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cicd-demo-app-jar
          path: target/*.jar
          retention-days: 7

  # Stage 2: Containerization & Smoke Verification (Continuous Delivery)
  docker-build-verify:
    name: Docker Build & Smoke Test
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: devops-cicd-demo:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start Container for Smoke Testing
        run: |
          docker run -d --name test-container -p 8080:8080 devops-cicd-demo:latest
          echo "Waiting for application to start..."
          sleep 15

      - name: Verify Application Health
        run: |
          echo "Checking HTTP health endpoint..."
          curl -f http://localhost:8080/api/health/ping || exit 1
          echo "Health check succeeded!"
          curl -f http://localhost:8080/api/health
          echo "Endpoints verified successfully."

      - name: Stop Smoke Test Container
        if: always()
        run: |
          docker stop test-container || true
          docker rm test-container || true

  # Stage 3: Deployment Notification / Registry Publish
  deploy:
    name: Continuous Deployment
    needs: docker-build-verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deployment Confirmation
        run: |
          echo "=========================================="
          echo "Automated CI/CD Pipeline Completed!"
          echo "Application image built and verified."
          echo "Deployment target: Production Ready."
          echo "=========================================="
