server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: devops-cicd-app

  # Default In-Memory H2 Database
  datasource:
    url: jdbc:h2:mem:devopsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  version: 1.0.0
  environment: local-development

# Management & Health Actuator Configuration for CI/CD Verification
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.devops.cicddemo: DEBUG
    org.springframework.web: INFO
