services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cicd-demo-app:latest
    container_name: devops_web_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_NAME=devops_db
      - DB_USER=devops_user
      - DB_PASSWORD=devops_pass
      - IS_DOCKER_CONTAINER=true
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - devops-network

  mysql-db:
    image: mysql:8.0
    container_name: devops_mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: devops_db
      MYSQL_USER: devops_user
      MYSQL_PASSWORD: devops_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - devops-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  prometheus:
    image: prom/prometheus:latest
    container_name: devops_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - devops-network

networks:
  devops-network:
    driver: bridge

volumes:
  mysql_data:
